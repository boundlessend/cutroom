[project]
name = "cutroom"
version = "1.0.0"
description = "Helpers of the cutroom video editing skill"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "requests",
]

# Helpers run as scripts via `uv run --project <skill dir>`; there is no package to build.
[tool.uv]
package = false
